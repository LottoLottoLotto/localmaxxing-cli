name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test Go CLI
        run: go test ./...

      - name: Build Go CLI
        run: go build ./cmd/lmx
