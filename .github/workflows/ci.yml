name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test Go CLI
        run: go test ./...

      - name: Build Go CLI
        run: go build ./cmd/lmx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.9.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build:cli

      - name: Check package contents
        run: npm pack -w localmaxxing --dry-run
