name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }} ${{ matrix.goarch }}
    # Each target builds on a native runner: the Go CLI cross-compiles fine, but
    # the companion llama.cpp scorer is native C++ and must be built per platform.
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: ""
          - goos: darwin
            goarch: arm64
            runner: macos-14
            ext: ""
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # --- Go CLI ---
      - name: Build lmx
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o "lmx${{ matrix.ext }}" ./cmd/lmx

      # --- Companion HellaSwag scorer (CMake + llama.cpp, CPU-only static) ---
      - name: Build HellaSwag scorer
        run: |
          cmake -S tools -B tools/build -DCMAKE_BUILD_TYPE=Release
          # Bounded parallelism: bare -j is unlimited and OOM-kills the smaller
          # runners (notably the ~7GB Apple Silicon macOS runner).
          cmake --build tools/build --config Release -j 2

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp tools/build/lmx-llama-score-hellaswag .
          # Archive always contains binaries named `lmx` and the scorer (asset
          # name encodes platform).
          tar -czf "dist/lmx-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            lmx lmx-llama-score-hellaswag

      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "tools\build\Release\lmx-llama-score-hellaswag.exe" .
          Compress-Archive -Force -Path lmx.exe, lmx-llama-score-hellaswag.exe `
            -DestinationPath "dist/lmx-${{ matrix.goos }}-${{ matrix.goarch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmx-${{ matrix.goos }}-${{ matrix.goarch }}
          # Only the built archive — never stray files that happen to sit in dist/.
          path: dist/lmx-*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
